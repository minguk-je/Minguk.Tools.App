__include__: [
  '../../dataset/mob_detection.yml',
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
]

output_dir: ./output/mob_n


DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B0'
  return_idx: [2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True


HybridEncoder:
  in_channels: [512, 1024]
  feat_strides: [16, 32]

  hidden_dim: 128
  use_encoder_idx: [1]
  dim_feedforward: 512

  expansion: 0.34
  depth_mult: 0.5


DFINETransformer:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  dim_feedforward: 512
  num_levels: 2

  num_layers: 3
  eval_idx: -1

  num_points: [6, 6]

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0002
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  # COCO 로 배운 것에서 이어 하는 것이라 기본값(0.0008)보다 낮춘다. 97장에 큰 학습률은 배운 것을 흔든다.
  lr: 0.0004
  betas: [0.9, 0.999]
  weight_decay: 0.0001


# 97장뿐이라 220 바퀴는 과하다. 60 바퀴로 보고 되찾기로 판단한다.
epochs: 60

train_dataloader:
  # GTX 1060 3GB. 배치를 키우면 메모리가 넘친다.
  total_batch_size: 4
  dataset:
    transforms:
      policy:
        epoch: 50
  collate_fn:
    stop_epoch: 50
    ema_restart_decay: 0.9999
    base_size_repeat: ~

val_dataloader:
  total_batch_size: 4
